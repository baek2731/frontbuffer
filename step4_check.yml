# =====================================================================
# Step 4 발행 확인 (step4_check.yml)
# =====================================================================
# 역할: Step 4 실행 2시간 후 오늘 발행 글이 있는지 확인
#       없으면 Discord 경고 알림
#
# 트리거: 평일 UTC 16:00 (Step 4 UTC 14:00 기준 2시간 후)
#         + 수동 트리거
#
# 감지 케이스:
#   1. Step 4 자체가 GitHub에서 스킵된 경우
#   2. Step 4가 실행됐으나 발행 실패한 경우
#   3. final/ 스택이 비어서 발행 건너뛴 경우
# =====================================================================

name: "Step 4 발행 확인"

on:
  schedule:
    - cron: '0 16 * * 1-5'   # 평일 UTC 16:00 (Step 4 후 2시간)
  workflow_dispatch:           # 수동 트리거

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 오늘 발행 확인
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(ls _posts/${TODAY}*.md 2>/dev/null | wc -l)

          echo "📅 확인 날짜: ${TODAY}"
          echo "📄 발행 글 수: ${COUNT}편"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ 오늘 발행 없음 — Discord 경고 전송"
            python notify.py custom \
              --title "⚠️ 오늘 발행 없음 (${TODAY})" \
              --body "Step 4가 스킵됐거나 발행에 실패했어요. Actions 탭을 확인하고 수동으로 실행해주세요." \
              --level warn
          else
            echo "✅ 오늘 발행 확인: ${COUNT}편 — 정상"
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
