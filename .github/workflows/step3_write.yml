# =====================================================================
# Step 3: 글 생성 + final/ 스택 저장 (v5 — 품질 체크 추가)
# =====================================================================

name: "Step 3 — Write Articles"

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Step 2 — Gemini 1차 호출 → 기획안 생성 + Grade 판정"]
    types:
      - completed

permissions:
  contents: write

# Step 2 가 이 워크플로우를 workflow_run 으로도, API 호출로도 시작시키므로
# 같은 Step 3 가 동시에 두 번 돌지 않도록 한 줄로 세운다 (두 번째는 대기 후 할 일이 없으면 바로 끝남)
concurrency:
  group: step3-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 80   # 품질 체크 시간 추가 여유

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Step 3 메인: 글 생성 루프 ─────────────────────────────────
      - name: Write all pending articles
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          MAX_ARTICLES=20
          COUNT=0
          LAST_ITEM=""
          FAIL_STREAK=0
          FAILURES=""
          NEW_FILES=""    # 이번 배치에서 새로 생성된 final/ 파일 목록
          PUSH_PENDING=0  # 푸시에 실패한 커밋이 남아 있는지

          # 다른 푸시와 겹쳐도(rebase) 최대 3번까지 다시 시도.
          # --autostash: 커밋하지 않은 파일(prompts 등)이 있어도 rebase 가 중단되지 않게 함
          push_with_retry() {
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                return 0
              fi
              echo "⚠️ 푸시 실패 ($i/3) — 재시도"
              sleep $((i * 5))
            done
            return 1
          }

          while [ $COUNT -lt $MAX_ARTICLES ]; do

            RESULT=$(python write.py next --json)
            OK=$(echo "$RESULT" | python -c "import sys,json; print(json.load(sys.stdin).get('ok', False))")

            if [ "$OK" != "True" ]; then
              echo "✅ 처리할 대상 없음 — 루프 종료"
              break
            fi

            CLUSTER=$(echo "$RESULT" | python -c "import sys,json; print(json.load(sys.stdin)['cluster_name'])")
            TYPE=$(echo "$RESULT"    | python -c "import sys,json; print(json.load(sys.stdin)['content_type'])")
            ITEM="${CLUSTER}__${TYPE}"

            if [ "$ITEM" = "$LAST_ITEM" ]; then
              FAIL_STREAK=$((FAIL_STREAK + 1))
              if [ $FAIL_STREAK -ge 2 ]; then
                echo "⛔ [$CLUSTER][$TYPE] 2회 연속 실패 — 스킵하고 다음으로"
                FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER"
                LAST_ITEM=""
                FAIL_STREAK=0
                continue
              fi
              echo "⚠️ 같은 항목 재시도 (${FAIL_STREAK}회차)"
            else
              LAST_ITEM="$ITEM"
              FAIL_STREAK=0
            fi

            COUNT=$((COUNT + 1))
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "[$COUNT] 🖊️  $CLUSTER [$TYPE]"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            echo "📝 [1/4] prep..."
            if ! python write.py prep "$CLUSTER" --type "$TYPE"; then
              echo "❌ prep 실패 — 다음 루프로"
              FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER (prep 실패)"
              continue
            fi

            # prep이 저장한 최신 write_prompt 파일에서 file_id 추출
            FILE_ID=$(ls -t research_data/write/prompts/write_prompt_*.txt 2>/dev/null \
                      | head -1 \
                      | xargs -I{} basename {} .txt \
                      | sed 's/^write_prompt_//')
            echo "  → file_id: $FILE_ID"

            echo "🤖 [2/4] Gemini 초안..."
            if ! python gemini_api.py --cluster "$CLUSTER" --type "$TYPE" ${FILE_ID:+--file-id "$FILE_ID"}; then
              echo "❌ Gemini 초안 실패 — 다음 루프로"
              FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER (초안 실패)"
              continue
            fi

            echo "🔍 [3/4] review prompt..."
            if ! python write.py review "$CLUSTER" --type "$TYPE"; then
              echo "❌ review 실패 — 다음 루프로"
              FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER (review 실패)"
              continue
            fi

            # review_prompt 파일에서 file_id 재확인 (review도 동일 file_id 사용)
            REVIEW_FILE_ID=$(ls -t research_data/write/prompts/review_prompt_*.txt 2>/dev/null \
                             | head -1 \
                             | xargs -I{} basename {} .txt \
                             | sed 's/^review_prompt_//')
            echo "  → review file_id: $REVIEW_FILE_ID"

            echo "✨ [4/4] Gemini 그라운딩 팩트체크..."
            if ! python gemini_review_api.py --cluster "$CLUSTER" --type "$TYPE" ${REVIEW_FILE_ID:+--file-id "$REVIEW_FILE_ID"}; then
              echo "❌ Gemini Review 실패 — 다음 루프로"
              FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER (팩트체크 실패)"
              continue
            fi

            # 새로 생성된 final/ 파일 추적 (품질 체크용)
            # 실제 파일명은 {order}_{week}_{folder}_{TYPE}.md (= FILE_ID). 예전에는 slug_TYPE 으로
            # 찾아서 항상 비어 있었고, 그 때문에 품질 체크가 final/ 전체를 매번 검사했다.
            FINAL_FILE="research_data/write/final/${FILE_ID}.md"
            if [ -n "$FILE_ID" ] && [ -f "$FINAL_FILE" ]; then
              NEW_FILES="${NEW_FILES:+$NEW_FILES,}$FINAL_FILE"
            fi

            # 최종본 생성 완료 → pipeline status 업데이트 (done 처리)
            # 제목을 final 파일 첫 H1에서 추출
            FINAL_TITLE=$(grep -m1 "^# " "research_data/write/final/${FILE_ID}.md" 2>/dev/null | sed 's/^# //' || echo "$CLUSTER")
            echo "  → 발행 완료 처리: $FINAL_TITLE"
            python write.py done "$CLUSTER"               --type "$TYPE"               --title "$FINAL_TITLE"               --url "pending"               --no-archive || true

            # prompts/ 등 다른 변경사항 건드리지 않고 final/만 커밋
            git add research_data/write/final/ content_pipeline.json

            if git diff --cached --quiet; then
              echo "⚠️ final/ 변경사항 없음 — 커밋 스킵"
            else
              git commit -m "feat: [$TYPE] $CLUSTER 최종본 생성"
              if push_with_retry; then
                echo "✅ 커밋 완료: [$TYPE] $CLUSTER"
              else
                echo "❌ 푸시 3회 실패 — 로컬 커밋은 유지, 마지막 단계에서 다시 시도"
                PUSH_PENDING=1
                FAILURES="${FAILURES:+$FAILURES,}[$TYPE] $CLUSTER (푸시 실패)"
              fi
            fi

            FAIL_STREAK=0

          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏁 전체 완료: $COUNT 건 처리"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          STACK=$(find research_data/write/final -name "*.md" \
                  ! -name "review_report_*" 2>/dev/null | wc -l || echo 0)
          echo "WRITE_COUNT=$COUNT"        >> $GITHUB_ENV
          echo "WRITE_STACK=$STACK"        >> $GITHUB_ENV
          echo "WRITE_FAILURES=$FAILURES"  >> $GITHUB_ENV
          echo "NEW_FILES=$NEW_FILES"      >> $GITHUB_ENV
          echo "PUSH_PENDING=$PUSH_PENDING" >> $GITHUB_ENV

      # ── 품질 체크 ─────────────────────────────────────────────────
      # final/ 에 새로 추가된 파일만 대상으로 Gemini YES/NO 평가
      # quality_report.json 생성 → notify.py가 읽어서 Discord 전송
      - name: "🔍 품질 체크 — 신규 글 평가"
        if: env.WRITE_COUNT != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$NEW_FILES" ]; then
            echo "📋 체크 대상: $NEW_FILES"
            python quality_check.py --files "$NEW_FILES"
          else
            # NEW_FILES 추적 실패 시 final/ 전체 체크 (안전망)
            echo "⚠️ NEW_FILES 없음 — final/ 전체 체크로 대체"
            python quality_check.py
          fi

      # ── quality_report.json 커밋 ──────────────────────────────────
      - name: "💾 품질 리포트 커밋"
        if: env.WRITE_COUNT != '0'
        run: |
          git add research_data/write/quality_report.json
          if git diff --cached --quiet; then
            echo "ℹ️ 리포트 변경 없음 — 커밋 스킵"
          else
            git commit -m "chore: quality_report 업데이트"
          fi
          # 위에서 푸시하지 못한 커밋이 있으면 함께 올라간다
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "✅ 푸시 완료"
              exit 0
            fi
            echo "⚠️ 푸시 실패 ($i/3) — 재시도"
            sleep $((i * 5))
          done
          echo "❌ 푸시 3회 실패"
          exit 1

      # ── Discord 알림: Step 3 완료 + 품질 체크 결과 ────────────────
      - name: "🔔 Discord 알림 — 글 생성 + 품질 체크 완료"
        if: always()
        run: |
          python notify.py step3_done \
            --count    "$WRITE_COUNT" \
            --stack    "$WRITE_STACK" \
            --failures "$WRITE_FAILURES"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # ── 안전망: 아직 원격에 올라가지 않은 커밋이 있으면 마지막으로 다시 푸시 ──
      - name: "📤 남은 커밋 푸시 (안전망)"
        if: always()
        run: |
          git fetch origin main || true
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          if [ "$AHEAD" -gt 0 ]; then
            echo "⚠️ 원격에 없는 커밋 ${AHEAD}개 — 푸시 시도"
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                echo "✅ 푸시 완료"
                exit 0
              fi
              sleep $((i * 5))
            done
            echo "❌ 푸시 실패 — 생성된 글이 원격에 없습니다. 이 실행을 다시 하세요."
            exit 1
          else
            echo "ℹ️ 올릴 커밋 없음"
          fi
