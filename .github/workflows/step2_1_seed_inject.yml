# =====================================================================
# Step 2-1: 개별 주제 추가
# =====================================================================
# 역할: 에디터가 직접 선택한 주제 키워드를 받아서
#       1. Google News RSS로 관련 기사 수집
#       2. Gemini 기획 → content_pipeline.json에 append
#       3. Step 3 자동 트리거 (글 생성)
#
# 트리거: 수동 트리거만 (schedule 없음)
#
# 사용 시점:
#   - Step 2 실행 전: config.json weekly_seeds로 넣는 것과 동일 효과
#   - Step 2 실행 후: 추가로 특정 주제만 빠르게 파이프라인에 삽입
#
# 입력값(topics, content_types)은 환경변수로 받아서 처리하므로
# 따옴표, $ 같은 문자가 들어 있어도 명령이 깨지지 않는다.
# =====================================================================

name: "Step 2-1 - 개별 주제 추가"

on:
  workflow_dispatch:
    inputs:
      topics:
        description: '추가할 주제 (콤마 구분, 예: RTX 5090 vs RTX 4090, Android 16 features)'
        required: true
        default: ''
      content_types:
        description: 'content_type 지정 (콤마 구분, 비우면 자동: GUIDE,COMPARISON,EXPLAINER)'
        required: false
        default: ''
      trigger_step3:
        description: 'Step 3 자동 트리거 여부'
        required: false
        default: 'true'

# Step 3 을 workflow_dispatch API 로 호출하므로 actions: write 가 필요하다
permissions:
  contents: write
  actions: write

concurrency:
  group: step2-1-seed-inject
  cancel-in-progress: false

jobs:
  seed_inject:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 주제 주입 + Google News RSS 수집 + Gemini 기획
        run: |
          python seed_inject.py \
            --topics "$INPUT_TOPICS" \
            --types  "$INPUT_TYPES"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_TOPICS:   ${{ github.event.inputs.topics }}
          INPUT_TYPES:    ${{ github.event.inputs.content_types }}

      - name: content_pipeline.json 커밋
        run: |
          git add content_pipeline.json research_data/weekly/
          if git diff --cached --quiet; then
            echo "ℹ️ 변경사항 없음"
            exit 0
          fi
          SHORT=$(printf '%s' "$INPUT_TOPICS" | cut -c1-80)
          git commit -m "feat: 개별 주제 추가 — ${SHORT}"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "✅ 커밋 완료"
              exit 0
            fi
            echo "⚠️ 푸시 실패 ($i/3) — 재시도"
            sleep $((i * 5))
          done
          echo "❌ 푸시 3회 실패"
          exit 1
        env:
          INPUT_TOPICS: ${{ github.event.inputs.topics }}

      - name: Step 3 자동 트리거
        if: github.event.inputs.trigger_step3 == 'true'
        run: |
          echo "🚀 Step 3 트리거..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/step3_write.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$CODE" = "204" ]; then
            echo "✅ Step 3 트리거 완료"
          else
            echo "⚠️ Step 3 트리거 실패 (HTTP $CODE) — Actions 에서 Step 3 를 직접 실행하세요"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
