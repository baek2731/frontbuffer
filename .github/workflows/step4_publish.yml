# =====================================================================
# Step 4: 주 2편 발행, 화·금 (final/ → _posts/)
# =====================================================================
# 트리거: cron 화·금 UTC 14:00 (한국 시간 화·금 23:00)
#         + 수동 트리거 (테스트용)
# 변경(2026-10-22): 발행을 주 2회로 낮추고, final/ 스택이 적을 때 Step 1을
#         자동으로 부르던 단계를 제거했다. 새 글은 검수한 뒤 final/ 에 직접 넣는다.
#
# 흐름:
#   publish_one.py 실행
#     1. final/에서 번호 순(FIFO)으로 파일 선택
#        HUB는 스포크 발행 조건 충족 후에만 선택
#        문제 파일(중복 의심, Gemini 메모 잔존 등)은 건너뛰고 다음 파일로 진행
#     2. 플레이스홀더 처리 ([INTERNAL LINK: ...] → 링크 / 매칭 실패 시 그 문장 삭제)
#     3. front matter 생성 (오늘 날짜, UTC 14시 랜덤 분)
#     4. _posts/YYYY-MM-DD-{slug}.md 저장
#     5. write.py done 호출 (실제 URL로 pipeline 기록)
#     6. final/ 파일 삭제 (중복 발행 방지)
#   _posts/ + pipeline + posts.json 커밋 → Jekyll 빌드
#
# 수동 실행 입력:
#   force_publish = true → 중복 의심 검사를 무시하고 발행
# =====================================================================

name: Step 4 - Publish Article

on:
  schedule:
    - cron: '0 14 * * 2,5'   # 화·금 UTC 14:00 (한국 시간 화·금 23:00)
  workflow_dispatch:           # 수동 트리거
    inputs:
      force_publish:
        description: '중복 의심 검사 무시하고 발행 (true/false)'
        required: false
        default: 'false'
      topic_seed:
        description: '추가 글 주제 시드 (Step 2 프롬프트 주입용, 선택사항)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: step4-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. 체크아웃 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 설치 ─────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 패키지 설치 ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pillow boto3

      # ── 4. Git 설정 ────────────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 5. 발행 실행 ───────────────────────────────────────────────
      # GEMINI_API_KEY: excerpt(메타 설명) 생성용. 없으면 본문 첫 문장으로 대체됨
      # DISCORD_WEBHOOK_URL: 발행 보류/실패 알림용 (notify.py)
      - name: Publish one article
        run: python publish_one.py
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_PUBLISH:       ${{ github.event.inputs.force_publish }}

      # ── 6. 커밋 + 푸시 ────────────────────────────────────────────
      # 주의: 글 제목(POST_TITLE)에는 따옴표 등이 들어갈 수 있으므로
      #       run 스크립트에 ${{ }} 로 직접 끼워 넣지 말고 반드시 $POST_TITLE 로 쓴다.
      - name: Commit and push
        run: |
          git add _posts/ \
                  research_data/write/final/ \
                  research_data/write/published/ \
                  content_pipeline.json \
                  posts.json

          if git diff --cached --quiet; then
            echo "ℹ️  변경사항 없음 (발행할 파일 없었음) — 스킵"
            exit 0
          fi

          git commit -m "feat: 발행 — ${POST_TITLE}"
          # 사용자가 먼저 푸시했어도 충돌 없이 반영
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "✅ 발행 완료: ${POST_TITLE}"
          echo "   URL: ${POST_URL}"

      # ── 7. IndexNow 제출 (Bing 즉시 색인 요청) ───────────────────
      - name: Submit to IndexNow
        if: env.POST_URL != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"frontbuffer.net\",
              \"key\": \"598f6bef9c054f238ee360ceb0374da3\",
              \"keyLocation\": \"https://frontbuffer.net/598f6bef9c054f238ee360ceb0374da3.txt\",
              \"urlList\": [\"${POST_URL}\"]
            }" | xargs -I{} echo "IndexNow 응답 코드: {}"

      # ── 8. OG 이미지 생성 + R2 업로드 ────────────────────────────
      # 방금 발행한 파일(POST_FILENAME)만 대상으로 함
      - name: Generate OG image and upload to R2
        if: env.POST_URL != ''
        run: |
          if [ -n "$POST_FILENAME" ] && [ -f "_posts/$POST_FILENAME" ]; then
            echo "OG 생성 대상: $POST_FILENAME"
            python og_generator.py --file "$POST_FILENAME" || true
          else
            echo "⚠️ POST_FILENAME 없음 — OG 생성 스킵"
          fi
        env:
          UNSPLASH_ACCESS_KEY:   ${{ secrets.UNSPLASH_ACCESS_KEY }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}

      # ── 9. OG + header 이미지 커밋 ───────────────────────────────
      - name: Commit OG assets
        run: |
          git add social_output/ _posts/ || true
          if git diff --cached --quiet; then
            echo "ℹ️ OG 변경사항 없음"
          else
            git commit -m "chore: OG 이미지 + header 추가 — ${POST_TITLE}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      # ── 10. 실패 시 Discord 알림 (publish_one.py 내부 알림과 별개) ─
      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -H "Content-Type: application/json" \
              -d "{\"content\": \"❌ Step 4 발행 실패 — 로그 확인: ${RUN_URL}\"}" \
              "$DISCORD_WEBHOOK_URL" > /dev/null
          else
            echo "⚠️ DISCORD_WEBHOOK_URL 없음 — 알림 스킵"
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
