# =====================================================================
# Step 4: 매일 1편 발행 (final/ → _posts/)
# =====================================================================
# 트리거: cron 매일 UTC 14:00 (주말 포함)
#         + 수동 트리거 (테스트용)
#
# 흐름:
#   publish_one.py 실행
#     1. final/에서 가장 오래된 파일 1개 선택 (FIFO)
#        HUB는 스포크 2개 이상 발행 후에만 선택
#     2. 플레이스홀더 제거 ([INTERNAL LINK: ...] 등)
#     3. front matter 생성 (오늘 날짜, UTC 14시 랜덤 분)
#     4. _posts/YYYY-MM-DD-{slug}_{type}.md 저장
#     5. write.py done 호출 (실제 URL로 pipeline 기록)
#     6. final/ 파일 삭제 (중복 발행 방지)
#   _posts/ + pipeline + posts.json 커밋 → Jekyll 빌드
# =====================================================================

name: Step 4 - Publish Article

on:
  schedule:
    - cron: '0 14 * * *'     # 매일 UTC 14:00 (주말 포함)
  workflow_dispatch:           # 수동 트리거 (테스트용)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. 체크아웃 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python 설치 ─────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. 패키지 설치 ─────────────────────────────────────────────
      - name: Install dependencies
        run: pip install requests pillow boto3

      # ── 4. Git 설정 ────────────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── 5. 발행 실행 ───────────────────────────────────────────────
      - name: Publish one article
        run: python publish_one.py

      # ── 6. 커밋 + 푸시 ────────────────────────────────────────────
      - name: Commit and push
        run: |
          git add _posts/ \
                  research_data/write/final/ \
                  research_data/write/published/ \
                  content_pipeline.json \
                  posts.json

          if git diff --cached --quiet; then
            echo "ℹ️  변경사항 없음 (발행할 파일 없었음) — 스킵"
            exit 0
          fi

          git commit -m "feat: 발행 — ${{ env.POST_TITLE }}"
          git push origin HEAD:main
          echo "✅ 발행 완료: ${{ env.POST_TITLE }}"
          echo "   URL: ${{ env.POST_URL }}"

      # ── 7. IndexNow 제출 (Bing 즉시 색인 요청) ───────────────────
      - name: Submit to IndexNow
        if: env.POST_URL != ''
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"frontbuffer.net\",
              \"key\": \"598f6bef9c054f238ee360ceb0374da3\",
              \"keyLocation\": \"https://frontbuffer.net/598f6bef9c054f238ee360ceb0374da3.txt\",
              \"urlList\": [\"${{ env.POST_URL }}\"]
            }" | xargs -I{} echo "IndexNow 응답 코드: {}"

      # ── 8. OG 이미지 생성 + R2 업로드 ────────────────────────────
      - name: Generate OG image and upload to R2
        if: env.POST_URL != ''
        run: |
          # _posts/에서 가장 최근 파일 찾아서 처리
          LATEST=$(ls -t _posts/*.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            echo "OG 생성 대상: $LATEST"
            python og_generator.py --file "$(basename $LATEST)" || true
          fi
        env:
          UNSPLASH_ACCESS_KEY:   ${{ secrets.UNSPLASH_ACCESS_KEY }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}

      # ── 9. OG + header 이미지 커밋 ───────────────────────────────
      - name: Commit OG assets
        run: |
          git add social_output/ _posts/ || true
          if git diff --cached --quiet; then
            echo "ℹ️ OG 변경사항 없음"
          else
            git commit -m "chore: OG 이미지 + header 추가 — ${{ env.POST_TITLE }}"
            git push origin HEAD:main
          fi

      # ── 10. final/ 스택 10편 이하 시 Step 1 자동 트리거 ───────────
      - name: Auto-trigger Step 1 if stack is low
        if: success()
        run: |
          # 숫자로 시작하는 스포크 + H로 시작하는 HUB만 카운트 (review_report .txt 제외)
          STACK=$(ls research_data/write/final/[0-9]*.md research_data/write/final/H*.md 2>/dev/null | wc -l)
          echo "현재 final/ 스택: ${STACK}편"
          if [ "${STACK}" -le 10 ]; then
            echo "⚠️ 스택 ${STACK}편 — Step 1 자동 트리거"
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/step1_research.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "ℹ️ 스택 ${STACK}편 — Step 1 트리거 불필요"
          fi
