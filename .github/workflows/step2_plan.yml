name: "Step 2 — Gemini 1차 호출 → 기획안 생성 + Grade 판정"

on:
  # ── 수동 트리거 ────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      week_tag:
        description: "주차 태그 (비워두면 자동: 2026-W29)"
        required: false
        default: ""

  # ── CSV push 감지 자동 트리거 ──────────────────────────────────────
  # CSV 업로드 후 수동으로 Run workflow 실행
  # (자동 트리거 제거 — CSV 전부 올린 후 수동 실행)

# Step 3 를 API 로 호출하므로 actions: write 가 필요하다
permissions:
  contents: write
  actions: write

concurrency:
  group: step2-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 리포 체크아웃"
        uses: actions/checkout@v4

      - name: "🐍 Python 세팅"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: "📦 패키지 설치"
        run: pip install requests beautifulsoup4 lxml

      # 입력값은 환경변수로 받는다 (따옴표/특수문자 안전)
      - name: "🗓️ 주차 태그 설정"
        env:
          INPUT_WEEK: ${{ github.event.inputs.week_tag }}
        run: |
          WEEK="$INPUT_WEEK"
          if [ -z "$WEEK" ]; then
            WEEK=$(python -c "from datetime import datetime,timezone; print(datetime.now(timezone.utc).strftime('%Y-W%W'))")
          fi
          if ! [[ "$WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "❌ 주차 태그 형식 오류: '$WEEK' (예: 2026-W41)"
            exit 1
          fi
          echo "WEEK_TAG=$WEEK" >> "$GITHUB_ENV"
          echo "TRIGGER_TYPE=manual" >> "$GITHUB_ENV"
          echo "🔧 수동 트리거 (주차: $WEEK)"

      - name: "🔍 Step 1 완료 여부 확인"
        run: |
          if [ ! -f "research_data/weekly/${WEEK_TAG}/prompt.txt" ]; then
            echo "❌ prompt.txt 없음 — Step 1을 먼저 실행하세요."
            exit 1
          fi
          echo "✅ prompt.txt 확인: research_data/weekly/${WEEK_TAG}/prompt.txt"
          wc -c "research_data/weekly/${WEEK_TAG}/prompt.txt"

      - name: "📈 Trends/KP CSV 현황 확인 (없으면 중단)"
        run: |
          echo "=== Trends 폴더 현황 ==="
          TRENDS_DIR="research_data/trends/${WEEK_TAG}"
          if [ -d "$TRENDS_DIR" ]; then
            find "$TRENDS_DIR" -name "*.csv" | sort | while read -r f; do
              SIZE=$(wc -c < "$f")
              echo "  ✅ $f ($SIZE bytes)"
            done
            CSV_COUNT=$(find "$TRENDS_DIR" -name "*.csv" | wc -l)
            echo ""
            echo "총 CSV 파일: ${CSV_COUNT}개"
            if [ "$CSV_COUNT" -eq 0 ]; then
              echo ""
              echo "❌ Trends/KP CSV 없음 — Step 2를 중단합니다."
              echo ""
              echo "📋 다음 순서로 진행하세요:"
              echo "  1. GitHub → research_data/weekly/${WEEK_TAG}/manual_report.md 열기"
              echo "  2. '🔍 Google Trends 검색 추천' 섹션에서 키워드 확인"
              echo "  3. Trends 링크 클릭 → CSV 다운로드"
              echo "  4. GitHub → research_data/trends/${WEEK_TAG}/{폴더명}/ 에 업로드"
              echo "  5. (선택) KP CSV → research_data/trends/${WEEK_TAG}/ 루트에 업로드"
              echo "  6. Step 2 다시 실행"
              exit 1
            fi
          else
            echo "❌ Trends 폴더 없음 ($TRENDS_DIR)"
            echo "   Step 1을 먼저 실행하세요."
            exit 1
          fi

      # research_gemini.py 는 topic_guard.py 로 기존 글 목록을 프롬프트에 넣고
      # 기존 글과 겹치는 기획안을 자동 제외한다 (로그의 🛡️ 줄 확인)
      - name: "🤖 Gemini 1차 호출 — 기획안 생성 + Grade 판정"
        run: python research_gemini.py "$WEEK_TAG"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   "gemini-2.5-flash"

      - name: "📊 결과 확인 — 기획안 Grade별 요약"
        run: |
          python - <<'PY'
          import json, os

          print("=== ai_result_latest.json Grade 분포 ===")
          data = json.load(open('research_data/ai_result_latest.json', encoding='utf-8'))
          grades = {'A': [], 'B': [], 'C': []}
          for d in data:
              grades.get(d.get('data_grade', 'C'), grades['C']).append(d)

          print(f"총 기획안: {len(data)}개\n")
          print(f"✅ Grade A (발행 확정): {len(grades['A'])}개")
          for d in grades['A']:
              print(f"   [{d.get('content_type','?')}] {d.get('suggested_title','')}")
          print()
          print(f"🔶 Grade B (발행 가능): {len(grades['B'])}개")
          for d in grades['B']:
              print(f"   [{d.get('content_type','?')}] {d.get('suggested_title','')}")
          print()
          print(f"❌ Grade C (폐기): {len(grades['C'])}개")
          for d in grades['C']:
              print(f"   [{d.get('content_type','?')}] {d.get('cluster_name','')}")

          # GitHub ENV로 candidate 수 출력
          candidates = len(grades['A']) + len(grades['B'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"CANDIDATE_COUNT={candidates}\n")

          print("\n=== content_pipeline.json 등록 현황 ===")
          pipe = json.load(open('content_pipeline.json', encoding='utf-8'))
          week = os.environ['WEEK_TAG']
          sels = pipe.get('weekly_selections', {}).get(week, [])
          cands = [s for s in sels if s.get('status') == 'candidate']
          rej   = [s for s in sels if s.get('status') == 'rejected']
          print(f"candidate (발행 대기): {len(cands)}개")
          for s in cands:
              print(f"  [{s.get('data_grade','?')}] [{s.get('content_type','?')}] {s.get('cluster_name','')}")
          print(f"rejected (폐기): {len(rej)}개")
          for s in rej:
              print(f"  [C] {s.get('cluster_name','')}")
          PY

      # push 가 거절돼도 3번까지 다시 시도한다 (예전에는 실패를 무시해서 결과가 유실될 수 있었음)
      - name: "💾 결과 커밋"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_data/ai_result_latest.json
          git add research_data/weekly/
          git add research_data/trends/
          git add content_pipeline.json
          if git diff --cached --quiet; then
            echo "ℹ️ 변경사항 없음"
            exit 0
          fi
          git commit -m "chore: Step2 기획안 생성+Grade판정 완료 ${WEEK_TAG}"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "✅ 푸시 완료"
              exit 0
            fi
            echo "⚠️ 푸시 실패 ($i/3) — 재시도"
            sleep $((i * 5))
          done
          echo "❌ 푸시 3회 실패"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Discord 알림: Step 2 완료 ────────────────────────────────────
      - name: "🔔 Discord 알림 — 기획안 생성 완료"
        if: success()
        run: |
          python notify.py step2_done \
            --week  "$WEEK_TAG" \
            --count "$CANDIDATE_COUNT"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # ── Step 3 자동 연쇄 트리거 ─────────────────────────────────────
      # 참고: step3_write.yml 은 workflow_run 으로도 Step 2 완료 시 시작된다.
      #       step3_write.yml 에 concurrency 를 걸어서 동시에 두 번 돌지 않게 했다.
      - name: "🚀 Step 3 자동 트리거"
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'step3_write.yml',
              ref: 'main'
            });
            console.log('✅ Step 3 트리거 완료');

      # ── Discord 알림: Step 2 실패 ────────────────────────────────────
      - name: "🔔 Discord 알림 — Step 2 실패"
        if: failure()
        run: |
          python notify.py custom \
            --title "Step 2 실패" \
            --body  "기획안 생성 중 오류 발생. Actions 로그를 확인하세요." \
            --level error
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
