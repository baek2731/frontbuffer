# =====================================================================
# Step 4 발행 확인 (step4_check.yml)
# =====================================================================
# 역할: Step 4 실행 2시간 후 오늘 발행 글이 있는지 확인
#       없으면 Discord 경고, 발행 대기 스택(final/)이 적으면 부족 경고
#
# 트리거: 매일 UTC 16:00 (Step 4 UTC 14:00 기준 2시간 후, 주말 포함)
#         + 수동 트리거
#
# 감지 케이스:
#   1. Step 4 자체가 GitHub에서 스킵된 경우
#   2. Step 4가 실행됐으나 발행 실패한 경우 (모든 후보가 보류된 경우 포함)
#   3. final/ 스택이 비어서 발행 건너뛴 경우
#   4. final/ 스택이 2편 이하로 줄어든 경우 (발행은 됐어도 곧 바닥남)
# =====================================================================

name: "Step 4 발행 확인"

on:
  schedule:
    - cron: '0 16 * * *'     # 매일 UTC 16:00 (주말 포함, Step 4와 동일하게 매일)
  workflow_dispatch:           # 수동 트리거

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: 오늘 발행 및 스택 확인
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          COUNT=$(ls _posts/${TODAY}-*.md 2>/dev/null | wc -l)
          # 숫자로 시작하는 스포크 + H로 시작하는 HUB만 카운트 (review_report .txt 제외)
          STACK=$(ls research_data/write/final/[0-9]*.md research_data/write/final/H*.md 2>/dev/null | wc -l)

          echo "📅 확인 날짜: ${TODAY}"
          echo "📄 오늘 발행 글 수: ${COUNT}편"
          echo "📦 final/ 스택: ${STACK}편"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ 오늘 발행 없음 — Discord 경고 전송"
            python notify.py custom \
              --title "⚠️ 오늘 발행 없음 (${TODAY})" \
              --body "Step 4가 스킵됐거나 발행에 실패했어요. 현재 final/ 스택 ${STACK}편. Actions 탭을 확인하고 수동으로 실행해주세요." \
              --level warn
          elif [ "$STACK" -le 2 ]; then
            echo "⚠️ 발행은 됐지만 스택 ${STACK}편 — 부족 경고 전송"
            python notify.py custom \
              --title "📦 발행 스택 부족 (${STACK}편 남음)" \
              --body "오늘 발행 ${COUNT}편은 정상입니다. final/ 에 ${STACK}편만 남았어요. Step 1 → Step 2 → Step 3 순서로 새 글을 채워주세요." \
              --level warn
          else
            echo "✅ 오늘 발행 확인: ${COUNT}편, 스택 ${STACK}편 — 정상"
          fi
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
